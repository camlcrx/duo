<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Duo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#F7F5FB">
<title>Duo · Comptes-rendus de visite</title>
<style>
:root{--navy:#2A2B57;--navy2:#4B4C8C;--ink:#1F2142;--mut:#6E7191;--line:#ECE8F4;--bg:#F7F5FB;--card:#fff;--amber:#A97B10;--amberL:#FFF3CF;--green:#2F8F6B;--greenL:#DDF4EA;--coral:#CF6A55;--coralL:#FFE9E0;--blue:#3F72B5;--blueL:#E2EFFC;--grey:#D5D6E2;--lav:#ECE7FF;--lavD:#6C5DD3;--rose:#FCE6EE;--roseD:#C0517A;--grad:linear-gradient(135deg,#8E7CF0 0%,#E99AC0 55%,#F6B08F 100%);--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(900px 500px at 0% -10%,#EFEAFF 0,transparent 60%),radial-gradient(700px 500px at 110% 0%,#FFEDE5 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.logo{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px;letter-spacing:-.5px;flex:none;box-shadow:0 8px 20px -10px rgba(108,93,211,.7)}
.logo span{display:none}
.top h1{font-size:20px;margin:0;letter-spacing:-.3px}
.top p{margin:0;color:var(--mut);font-size:13px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--navy2);font-weight:600;font-size:15px;padding:6px 0;margin-bottom:6px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:26px 2px 10px;font-weight:700}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 0 rgba(42,43,87,.03),0 14px 34px -22px rgba(42,43,87,.35);border:1px solid rgba(42,43,87,.05)}
.hero{background:radial-gradient(at 0% 0%,#DCD3FF 0,transparent 55%),radial-gradient(at 100% 0%,#FFD9C9 0,transparent 50%),radial-gradient(at 100% 100%,#CFE6FB 0,transparent 55%),radial-gradient(at 0% 100%,#D6F2E6 0,transparent 50%),#F1EDFF;color:var(--ink);border-radius:26px;padding:22px 18px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.8);box-shadow:0 20px 40px -28px rgba(108,93,211,.6)}
.hero h1{margin:0 0 4px;font-size:24px;letter-spacing:-.4px}
.hero p{margin:0;color:#4D4F75;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:rgba(255,255,255,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:10px 12px}
.stat b{display:block;font-size:22px;letter-spacing:-.5px}
.stat span{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mcard{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.mrow{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:16px;letter-spacing:.5px}
.av.lg{width:62px;height:62px;font-size:21px}
.mname{font-weight:700;font-size:16.5px;letter-spacing:-.2px}
.msub{font-size:13px;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--blueL);color:var(--blue);white-space:nowrap}
.pill.dms{background:var(--lav);color:var(--lavD)}
.pill.dmv{background:#DDF1F4;color:#2B7E8A}
.pill.am{background:var(--amberL);color:var(--amber)}
.pill.gr{background:var(--greenL);color:var(--green)}
.pill.co{background:var(--coralL);color:var(--coral)}
.pill.mu{background:#EFEDE8;color:var(--mut)}
.obj{font-size:13.5px;background:var(--lav);color:#3F3687;border-radius:14px;padding:9px 11px;line-height:1.35}
.obj b{color:var(--lavD)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--grey)}
.l1{background:#F08A7E}.l2{background:#F4BE57}.l3{background:#45B58C}.l0{background:#DCDDE8}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--navy);color:#fff;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--navy2);padding:8px 10px}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:11px}
.btn.amb{background:var(--grad);box-shadow:0 12px 26px -14px rgba(192,81,122,.8)}
.btn.full{width:100%}
.btn.danger{background:#fff;color:var(--coral);border:1px solid #F0CFC8}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lbl{font-size:12.5px;font-weight:700;color:var(--mut);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none;font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(38,57,95,.12)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--lavD);border-color:var(--lavD);color:#fff}
.mic-zone{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 4px}
.mic{width:92px;height:92px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;position:relative;box-shadow:0 10px 28px -10px rgba(20,35,63,.6)}
.mic svg{width:34px;height:34px}
.mic.rec{background:var(--roseD)}
.mic.rec:before,.mic.rec:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #E99AC0;animation:pulse 1.6s infinite}
.mic.rec:after{animation-delay:.8s}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(1.6);opacity:0}}
.mic-hint{font-size:13.5px;color:var(--mut);text-align:center;max-width:460px}
.dict{min-height:200px;font-size:16.5px}
.seg{display:flex;background:#ECE8F6;border-radius:12px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;padding:8px 10px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--mut);white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav a{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;font-size:11.5px;font-weight:600;color:var(--mut);padding:4px}
.nav a.on{color:var(--lavD)}
.nav svg{width:24px;height:24px}
/* report */
.rhead{display:flex;gap:14px;align-items:flex-start}
.headline{font-size:21px;font-weight:800;letter-spacing:-.4px;line-height:1.25;margin:10px 0 4px}
.meta{font-size:13.5px;color:var(--mut)}
.sec{border-radius:var(--r);padding:14px 16px;margin-top:12px}
.sec h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;letter-spacing:-.1px}
.sec.g{background:var(--greenL)}.sec.g h3{color:var(--green)}
.sec.c{background:#fff;border:1px solid #F6DCE6}.sec.c h3{color:var(--roseD)}
.sec.a{background:var(--lav)}.sec.a h3{color:var(--lavD)}
.sec.b{background:var(--blueL)}.sec.b h3{color:var(--blue)}
.sec.w{background:#fff;border:1px solid var(--line)}
.sec.y{background:var(--amberL)}.sec.y h3{color:var(--amber)}
.sec.p{background:linear-gradient(160deg,#2A2B57,#3F3A7A);color:#ECEBFA}.sec.p h3{color:#F9C9B4}
.it{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.it+.it{border-top:1px dashed rgba(0,0,0,.08)}
.it .tx{flex:1}
.tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;opacity:.75}
.keep{font-size:12.5px;color:#4E6E5E;margin-top:2px}
.x{color:#A9AEB8;font-size:18px;line-height:1;padding:2px 4px}
.axis{background:var(--rose);border-radius:16px;padding:12px;margin-top:8px}
.axis .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--roseD);color:#fff;font-size:12px;font-weight:800;margin-right:6px}
.axis .t{font-weight:800;font-size:15px}
.axis .o{font-size:14px;color:#7A3553;margin:6px 0;font-style:italic}
.axis .adv{font-size:14.5px;background:#fff;border-radius:10px;padding:9px 11px;margin-top:6px;line-height:1.45}
.axis .adv b{color:var(--navy)}
.axis .alt{font-size:13px;color:var(--mut);margin-top:6px}
[contenteditable]{outline:none;border-radius:6px;transition:background .15s}
[contenteditable]:focus{background:rgba(255,255,255,.8);box-shadow:0 0 0 2px rgba(38,57,95,.2)}
.sec.p [contenteditable]:focus{background:rgba(255,255,255,.08)}
.ob{padding:8px 0}
.ob+.ob{border-top:1px dashed rgba(0,0,0,.1)}
.ob .q{font-weight:700;font-size:14px}
.ob .r{font-size:14px;margin-top:3px;white-space:pre-wrap}
.ob .pr{font-size:12px;color:var(--mut);margin-top:3px}
.gridc{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.gc{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 10px;font-size:13.5px;text-align:left}
.gc .dot{width:12px;height:12px;flex:none}
.gc small{display:block;color:var(--mut);font-size:11.5px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:16px}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tli{position:relative;margin-bottom:10px;width:100%;text-align:left;display:block}
.tli:before{content:"";position:absolute;left:-17px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--lavD);border:2px solid var(--bg)}
.matrix{overflow-x:auto}
.matrix table{border-collapse:collapse;width:100%;font-size:13px}
.matrix td,.matrix th{padding:5px 6px;text-align:center}
.matrix th{font-size:11.5px;color:var(--mut);font-weight:700}
.matrix td:first-child,.matrix th:first-child{text-align:left;white-space:nowrap}
.matrix .dot{display:inline-block;width:13px;height:13px}
.fld{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.fld{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-top:12px}
.info dt{color:var(--mut)}
.info dd{margin:0}
.lib details{background:#fff;border-radius:14px;padding:12px 14px;margin-top:8px;border:1px solid var(--line)}
.lib summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
.lib summary::-webkit-details-marker{display:none}
.lib summary:after{content:"+";color:var(--mut);font-weight:400;font-size:20px;line-height:1}
.lib details[open] summary:after{content:"-"}
.lib p,.lib li{font-size:14.5px}
.lib ul{padding-left:18px;margin:8px 0}
.step{display:flex;gap:12px;padding:10px 0}
.step+.step{border-top:1px solid var(--line)}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--lavD);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.step b{display:block}
.step span{font-size:14px;color:#3E4557}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.muted{color:var(--mut);font-size:13.5px}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.prev{border:1px dashed var(--lavD);background:var(--lav);border-radius:14px;padding:12px}
.small{font-size:13px}
.kpi{display:grid;grid-template-columns:1.3fr 1fr auto;gap:8px;margin-top:6px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:30px}
.plist{display:grid;gap:8px}
.prod h4{margin:0 0 4px;font-size:16px}
.prod .cls{font-size:12.5px;color:var(--mut)}
.prod .m{font-size:14.5px;margin:8px 0}
.foot.tiny{font-size:10px;opacity:.55;margin-top:40px}
/* dictée plein écran */
.ov{position:fixed;inset:0;z-index:60;background:radial-gradient(90% 60% at 20% 0%,#5A4FB0 0%,transparent 60%),radial-gradient(80% 50% at 100% 100%,#8C4F7E 0%,transparent 60%),#1E1F45;color:#fff;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
.ov[hidden]{display:none}
.ov-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;opacity:.85}
.ov-state{display:inline-flex;align-items:center;gap:8px}
.ov-state:before{content:"";width:9px;height:9px;border-radius:50%;background:#FF6B57;box-shadow:0 0 0 4px rgba(255,107,87,.25);animation:blink 1.2s infinite}
.ov.paused .ov-state:before{background:#F6B08F;animation:none}
@keyframes blink{50%{opacity:.35}}
.ov-name{font-size:13px;opacity:.6;margin-top:10px}
.ov-text{flex:1;overflow-y:auto;font-size:23px;line-height:1.45;font-weight:500;letter-spacing:-.2px;margin:12px 0;white-space:pre-wrap;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12px);padding-top:6px}
.ov-text .int{opacity:.45}
.ov-text .ph{opacity:.4;font-size:19px}
.bars{display:flex;justify-content:center;align-items:center;gap:6px;height:64px}
.bars i{width:6px;height:10px;border-radius:4px;background:linear-gradient(#C9BEFF,#F6B08F);transition:height .15s}
.ov.speaking .bars i{animation:bar .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.1s!important}.bars i:nth-child(3){animation-delay:.25s!important}.bars i:nth-child(4){animation-delay:.05s!important}.bars i:nth-child(5){animation-delay:.3s!important}.bars i:nth-child(6){animation-delay:.15s!important}.bars i:nth-child(7){animation-delay:.35s!important}.bars i:nth-child(8){animation-delay:.2s!important}.bars i:nth-child(9){animation-delay:.4s!important}
@keyframes bar{0%,100%{height:10px}50%{height:54px}}
.ov.paused .bars i{animation:none;height:6px;opacity:.4}
.ov-help{font-size:12.5px;opacity:.6;text-align:center;margin:8px auto 14px;max-width:520px;line-height:1.5}
.ov-btns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.ov-btns button{border-radius:18px;padding:18px;font-weight:800;font-size:17px;background:rgba(255,255,255,.1);color:#fff}
.ov-btns .go{background:var(--grad);color:#fff}
.cmd{display:inline-block;background:rgba(255,255,255,.12);border-radius:6px;padding:1px 6px;margin:2px 1px;font-weight:600}
/* méthodes visuelles */
.tbar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin:8px 0 4px}
.tbar i{flex:1}
.tleg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut)}
.dstep{display:flex;gap:12px;background:#fff;border-radius:16px;padding:14px;margin-top:10px;border:1px solid var(--line)}
.dstep .n{width:34px;height:34px;border-radius:11px;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.dstep .tt{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800}
.dstep .tt span{font-size:11.5px;font-weight:700;color:var(--mut);background:var(--bg);padding:2px 8px;border-radius:999px}
.dstep p{margin:4px 0 0;font-size:14px;color:#3E4557}
.quote{background:var(--bg);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:14px;font-style:italic;margin-top:8px;color:var(--navy)}
.vcard{background:#fff;border-radius:16px;padding:14px;margin-top:10px;border:1px solid var(--line)}
.vcard h4{margin:0 0 10px;font-size:15.5px}
.vcard .sub{font-size:13px;color:var(--mut);margin:-6px 0 10px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri>div{border-radius:14px;padding:11px;font-size:13px;line-height:1.35}
.tri b{display:block;font-size:24px;line-height:1;margin-bottom:6px}
.tri .k{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.cb{background:var(--blueL);color:#2C568C}.ca{background:var(--amberL);color:#7A5A0C}.cg{background:var(--greenL);color:#226B50}.cc{background:var(--rose);color:#8E3A5B}.cv{background:var(--lav);color:#4A3FA0}.ct{background:#DDF1F4;color:#226670}
.tri.stack{grid-template-columns:1fr}.tri.stack>div{display:grid;grid-template-columns:34px 1fr;column-gap:10px;align-items:start}.tri.stack b{grid-row:span 2;margin:0}
.m2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m2>div{border-radius:14px;padding:12px;font-size:13.5px;line-height:1.4}
.m2 .k{font-weight:800;font-size:14px;margin-bottom:4px}
.flow{display:flex;gap:4px;overflow-x:auto;padding:2px 0 6px;align-items:center}
.flow span{flex:none;padding:8px 11px;border-radius:12px;background:var(--bg);font-weight:700;font-size:13px;color:var(--mut)}
.flow span.hot{background:var(--lavD);color:#fff}
.flow em{color:#B9BDC6;font-style:normal;flex:none}
.funnel>div{margin:6px auto;border-radius:12px;padding:9px 12px;color:#fff;font-size:13.5px}
.funnel b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;opacity:.8}
.cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cycle>div{text-align:center;border-radius:14px;padding:10px 6px;font-size:12.5px;line-height:1.3}
.cycle b{display:block;font-size:20px;margin-bottom:2px}
.figs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.fig{display:inline-flex;flex-direction:column;background:linear-gradient(135deg,#2A2B57,#5A4FB0);color:#fff;border-radius:12px;padding:8px 12px;min-width:90px}
.fig b{font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.fig span{font-size:11.5px;opacity:.75}
.objc{border-left:4px solid var(--coral);background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.objc .q{font-weight:800;font-size:14.5px}
.objc .r{font-size:14px;margin-top:4px}
.objc .src{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;color:var(--blue);background:var(--blueL);padding:2px 8px;border-radius:999px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

const norm = s => (s||"").toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’`´]/g,"'");
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function re(list){return new RegExp("(?:^|[^a-z0-9])(?:"+list.map(k=>k.endsWith("!")?esc(k.slice(0,-1))+"(?![a-z0-9])":esc(k)).join("|")+")","g")}
const RE_POS=re(POS), RE_NEG=re(NEG), RE_WELL=re(WELL_PRIV), RE_PRESC=re(["il faut","faudrait","il faudra","devrait","doit encore","gagnerait","a travailler","a ameliorer","axe de progres","a revoir"]);
THEMES.forEach(t=>t.re=re(t.kw));
OBJECTIONS.forEach(o=>o.re=re(o.kw));
Object.values(PRODUCTS).forEach(p=>p.re=re(p.kw));
const hits=(t,r)=>{r.lastIndex=0;return (t.match(r)||[]).length};

const CONNECT=/(?=(?:^|\s)(?:mais|par contre|en revanche|cependant|toutefois|n[ée]anmoins|et puis|ensuite|par ailleurs|d'autre part|sinon|autre point|point positif|point n[ée]gatif|côté)\s)/i;
function clauses(text){
  const out=[];
  (text||"").replace(/\r/g,"").split(/[.!?;\n]+/).forEach(s=>{
    s.split(CONNECT).forEach(c=>{ c=c.trim(); if(c) out.push(c) });
  });
  return out;
}
function clean(c){
  let s=" "+c+" ";
  s=s.replace(/(\s)(euh+|heu+|bah|ben|bon ben|du coup|en fait|voil[aà]|genre|tu vois|on va dire)(?=[\s,]|$),?/gi,"$1");
  s=s.trim().replace(/,?\s*quoi$/i,"");
  for(let i=0;i<3;i++) s=s.replace(/^(mais|par contre|en revanche|cependant|toutefois|n[ée]anmoins|et puis|ensuite|par ailleurs|d'autre part|sinon|et|alors|donc|aussi|autre point|point positif|point n[ée]gatif)\b[\s,:]*/i,"");
  s=s.replace(/\s{2,}/g," ").replace(/^[,\s-]+|[,\s-]+$/g,"");
  return s?s.charAt(0).toUpperCase()+s.slice(1):s;
}
function polarity(nt){
  let p=hits(nt,RE_POS), n=hits(nt,RE_NEG)+hits(nt,RE_PRESC);
  if(/\b(pas|jamais|peu|plus)\s+(tres\s+|assez\s+|vraiment\s+|toujours\s+|super\s+|si\s+|forcement\s+)?(bien|bon|bonne|clair|efficace|pertinent\w*|fluide|convaincant\w*|a l'aise|naturel\w*|structure\w*|precis\w*|adapte\w*|juste)\b/.test(nt)) p-=2;
  if(/\b(n'a pas|n'ont pas|sans|jamais|pas)\s+(\w+\s+)?(hesite\w*|oublie\w*|manque\w*|insiste\w*|perdu\w*|decroche\w*)/.test(nt)) n-=2,p+=1;
  if(/\bn(e\s|')\s?\w+(\s[\w']+){0,4}\s(pas|jamais|que|aucun\w*|guere)\b/.test(nt) && !/\bn'a pas (hesite|oublie|manque)/.test(nt)) n+=1;
  const s=p-n; return s>0?1:s<0?-1:0;
}
function themeOf(nt){
  let best=null,bh=0;
  THEMES.forEach(t=>{const h=hits(nt,t.re);if(h>bh||(h===bh&&h>0&&t.w>best.w)){bh=h;best=t}});
  return best?best.id:null;
}
function pickAdvice(th,txt){
  const t=TH[th], nt=norm(txt);
  let bi=0,bs=-1; t.adv.forEach((a,i)=>{const s=(a.k||[]).reduce((n,k)=>n+(nt.includes(k)?1:0),0);if(s>bs){bs=s;bi=i}});
  return {main:t.adv[bi], alt:t.adv[(bi+1)%t.adv.length]};
}
function detectProducts(items){
  const set=new Set();
  items.forEach(it=>{ if(it.priv) return;
    Object.entries(PRODUCTS).forEach(([k,p])=>{ if(hits(it.nt,p.re)){
      if(/pas (\w+ )?(aborde|parle|presente|evoque|mentionne)|oubli|n'a pas (\w+ )?(parle|aborde|presente)/.test(it.nt)) return;
      set.add(k);
    }});
  });
  return set;
}
function productMsg(k){return (S.campaign.msgs&&S.campaign.msgs[k])||PRODUCTS[k].msg}

function analyse(text, member, ctx){
  const items = clauses(text).map(raw=>{
    const nt=norm(raw), c=clean(raw), words=c.split(/\s+/).length;
    const th=themeOf(nt), pol=polarity(nt), priv=hits(nt,RE_WELL)>0;
    return {raw,nt,c,words,th,pol,priv};
  }).filter(it=>it.c && it.words>=3);

  const pub = items.filter(i=>!i.priv);
  const posItems = pub.filter(i=>i.pol>0);
  const negItems = pub.filter(i=>i.pol<0 && !(/pas (\w+ )?(aborde|parle|presente|evoque|mentionne)|n'a pas (\w+ )?(parle|aborde|presente)/.test(i.nt)&&Object.values(PRODUCTS).some(p=>hits(i.nt,p.re))));

  // Points forts : un par compétence d'abord, puis le reste
  const seen=new Set(), strengths=[];
  posItems.slice().sort((a,b)=>((b.th?TH[b.th].w:0)-(a.th?TH[a.th].w:0))).forEach(i=>{
    if(strengths.length>=5) return;
    const first=i.th&&!seen.has(i.th);
    strengths.push({text:i.c, th:i.th||"", keep:first?TH[i.th].keep:""});
    if(i.th) seen.add(i.th);
  });

  // Axes : regroupés par compétence, triés par fréquence puis importance
  const map={}; const other=[];
  const NOTDISC=/pas (\w+ )?(aborde|parle|presente|evoque|mentionne)|n'a pas (\w+ )?(parle|aborde|presente)/;
  negItems.forEach(i=>{ if(NOTDISC.test(i.nt)&&Object.values(PRODUCTS).some(p=>hits(i.nt,p.re))) return; if(!i.th){other.push(i.c);return} (map[i.th]=map[i.th]||[]).push(i.c) });
  const order=Object.keys(map).sort((a,b)=>(map[b].length-map[a].length)||(TH[b].w-TH[a].w));
  const axes=order.slice(0,3).map(th=>{
    const obs=map[th].join(" · "); const pa=pickAdvice(th,obs);
    return {th, label:TH[th].label, obs, adv:pa.main.t+" → "+pa.main.d, alt:pa.alt.t+" → "+pa.alt.d};
  });
  order.slice(3).forEach(th=>map[th].forEach(c=>other.push(c)));

  // Objections entendues
  const allPub=pub.map(i=>i.nt).join(" . ");
  const objs=OBJECTIONS.filter(o=>hits(allPub,o.re)).map(o=>({o:o.o,r:o.r.map(x=>"• "+x).join("\n"),pr:o.pr,st:OBJ_ST[o.id]||[]}));

  // Produits & campagne
  const detected=detectProducts(items);
  const worked=new Set([...(ctx.products||[]),...detected]);
  const camp=[];
  (S.campaign.priority||[]).forEach(k=>{
    if(PRODUCTS[k]&&PRODUCTS[k].roles.includes(member.role)&&!worked.has(k))
      camp.push(k+" est prioritaire sur le cycle et n'a pas été abordé : à intégrer au prochain duo.");
  });
  pub.forEach(i=>{ if(!NOTDISC.test(i.nt)) return; Object.entries(PRODUCTS).forEach(([k,p])=>{ if(hits(i.nt,p.re)&&!(S.campaign.priority||[]).includes(k)) camp.push(k+" non abordé : à prévoir selon le potentiel du médecin."); }); });
  // Chiffres
  (ctx.kpis||[]).filter(x=>x.p&&x.v!==""&&!isNaN(parseFloat(x.v))).forEach(x=>{
    const v=parseFloat(String(x.v).replace(",","."));
    if(v<0) camp.push(x.p+" en recul ("+v+" %)"+(axes[0]?" : l'axe « "+axes[0].label+" » est le levier prioritaire sur ce produit.":" : en faire le message prioritaire des prochaines visites."));
    else if(v>0) camp.push(x.p+" en progression (+"+v+" %)"+(strengths[0]&&strengths[0].th?" : la dynamique s'appuie sur « "+TH[strengths[0].th].label.toLowerCase()+" », à poursuivre.":" : à poursuivre."));
  });

  if(S.campaign.imported){ [...worked].forEach(k=>{ const msg=S.campaign.msgs&&S.campaign.msgs[k]; if(msg) camp.push("Message clé du cycle · "+k+" : "+msg); }); }
  // Grille
  const grid={};
  GRID_THEMES.forEach(t=>{
    const p=posItems.some(i=>i.th===t), n=negItems.some(i=>i.th===t);
    grid[t]=p&&n?2:p?3:n?1:0;
  });

  // Synthèse
  const ns=strengths.length, na=axes.length;
  let headline;
  if(!ns&&!na) headline="Compte-rendu à compléter : précisez ce qui a bien fonctionné et ce qui peut progresser.";
  else if(!na) headline="Très belle journée : une pratique maîtrisée, à capitaliser et à partager avec l'équipe.";
  else if(ns>=na) headline="Journée solide. Priorité : "+axes[0].label.toLowerCase()+".";
  else headline="Journée à consolider. Priorité : "+axes[0].label.toLowerCase()+".";

  let objective="";
  if(axes[0]) objective=TH[axes[0].th].obj;
  else if(strengths[0]) objective="Partager en réunion d'équipe une bonne pratique observée : « "+strengths[0].text+" ».";

  const coachQ = axes[0]?TH[axes[0].th].q:(strengths[0]&&strengths[0].th?TH[strengths[0].th].q:"Quelle a été ta meilleure visite aujourd'hui, et pourquoi ?");

  const privItems=items.filter(i=>i.priv).map(i=>i.c);
  let priv=privItems.join("\n");
  if(privItems.length) priv+="\n→ Prévoir un échange en tête-à-tête sur la charge et le rythme, hors compte-rendu.";

  const pf=profilOf(member); let posture=pf?PROFILS[pf].l+" · "+PROFILS[pf].p:"";
  if(pf==="expert"&&strengths[0]) posture+="\nÀ valoriser : proposer de partager « "+strengths[0].text+" » en réunion d'équipe.";
  if(pf==="nouveau"&&axes[0]) posture+="\nMontrer l'exemple sur « "+axes[0].label.toLowerCase()+" » lors d'une visite du prochain duo.";
  return {headline, strengths, axes, other, objs, camp, objective, coachQ, grid, priv, posture, products:[...worked]};
}

function vCV(m){

   ${m.form&&m.form.length?`<div class="lbl" style="margin-top:16px">Formation</div><div class="cvf">${m.form.map(f=>`<div class="cvfi"><div class="cvfic">🎓</div><div><b>${h(f.ec)}</b><div class="cvp">${h(f.di)}</div>${f.an?`<div class="cvd">${h(f.an)}</div>`:""}</div></div>`).join("")}</div>`:`<div class="muted small" style="margin-top:12px">Formation non renseignée.</div>`}

function render(){

  const app=$("#app");

function parseCampaign(txt){
  const lines=txt.replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean);
  const out={cycle:"",prods:{},notes:[]}; let cur=null;
  const prodsIn=nt=>Object.keys(PRODUCTS).filter(k=>hits(nt,PRODUCTS[k].re));
  lines.forEach((l,idx)=>{
    const nt=norm(l), ps=prodsIn(nt), clean=l.replace(/^[-•*·-\d.)\s]+/,"").replace(/^(message cl[ée]|messages cl[ée]s|cl[ée]|argument)\s*:\s*/i,"");
    if(!out.cycle&&/(cycle|campagne|vague|plan de)/.test(nt)&&l.split(/\s+/).length<=10&&!ps.length){out.cycle=clean;return}
    if(/(prioritaire|priorite|priorites|focus)/.test(nt)&&ps.length){ps.forEach(k=>{(out.prods[k]=out.prods[k]||{msg:[],prio:false}).prio=true});return}
    if(ps.length===1&&l.split(/\s+/).length<=4){cur=ps[0];out.prods[cur]=out.prods[cur]||{msg:[],prio:false};return}
    if(ps.length===1&&!/^[-•*·-]/.test(l)){cur=ps[0];const p=out.prods[cur]=out.prods[cur]||{msg:[],prio:false};const rest=clean.replace(new RegExp("^\\s*"+cur+"\\s*[:·--]\\s*","i"),"");if(rest&&rest.length>3)p.msg.push(rest);return}
    if(cur&&/^[-•*·-]/.test(l)){out.prods[cur].msg.push(clean);return}
    cur=null; out.notes.push(clean);
  });
  Object.values(out.prods).forEach(p=>p.msg=p.msg.join(" "));
  return out;
}

let REC=null, recOn=false, committed="", interimTxt="", t0=0, elapsed=0, tick=null, WL=null, spkT=null, pendingGen=false;
const VOCAB=[
 [/\btri\s?pl[ie]?\s?[xk]?s?\s?[ae]m+e?s?\b|\btriple\s?(x|ix|ex)\s?[ae]m+e?\b|\btripli[xk]s?[ae]n+e?\b/gi,"Triplixam"],
 [/\bcover?\s?[ae]m+e?\b/gi,"Coveram"],
 [/\bco\s?s[iy]m\s?pr[eè]l+e?\b|\bcosimprelle\b/gi,"Cosimprel"],
 [/\bnatri\s?[xk]s?\s?[ae]m+e?\b/gi,"Natrixam"],
 [/\bbi\s?pr[eé]t[eé]\s?ra[xk]s?\b/gi,"Bipreterax"],
 [/\blipo\s?ro[sz][ae]s?\b/gi,"Liporosa"],
 [/\bjun?\s?nal[iy][sz]{1,2}a\b/gi,"Junaliza"],
 [/\bda\s?f+lon+e?\b/gi,"Daflon"],
 [/\bp[eé]tra\b/gi,"PETRA"],[/\bsn?[iy]\s?man+\b/gi,"Snyman"],[/\bstrath?[eé]e?\b/gi,"STRATHE"],
 [/\bhyv[eè]t+e?\b/gi,"HYVET"],[/\badvance\b/gi,"ADVANCE"],[/\bascot+e?\b/gi,"ASCOT"],[/\beuropa\b/gi,"EUROPA"],
 [/\bp[eé]rin\s?do\s?pril+e?\b/gi,"périndopril"],[/\binda\s?pa\s?mide\b/gi,"indapamide"],[/\bamlo\s?dipine\b/gi,"amlodipine"],
 [/\brosu\s?va\s?statine\b/gi,"rosuvastatine"],[/(^|\s)[eé]z[eé]\s?ti\s?mi[bd]e\b/gi,"$1ézétimibe"],
 [/\bh\s?t\s?a\b/gi,"HTA"],[/\bl\s?d\s?l\b/gi,"LDL"],[/\bcrm\b/gi,"CRM"],[/\bc\s?h\s?u\b/gi,"CHU"],[/\bdocteur\b/gi,"Dr"]
];
function fixVocab(t){VOCAB.forEach(([r,v])=>{t=t.replace(r,v)});return t}
function processFinal(seg){
  let t=" "+seg.trim()+" ", n=norm(t), cmd=null;
  if(/(genere|generer|lance|fais)( moi)? (le |un )?(compte rendu|compte-rendu|cr)\s*$/.test(n.trim())){cmd="gen";t=t.replace(/\s(g[ée]n[èeé]re[rz]?|lance|fais)( moi)? (le |un )?(compte[ -]rendu|CR)\s*$/i," ")}
  else if(/(termine|fin de (la )?dictee|stop (la )?dictee|arrete (la )?dictee|c'est tout)\s*$/.test(n.trim())){cmd="stop";t=t.replace(/\s(termin[ée]e?|fin de (la )?dict[ée]e|stop (la )?dict[ée]e|arr[êe]te (la )?dict[ée]e|c'est tout)\s*$/i," ")}
  if(/(efface|supprime|annule) (la |cette )?derniere phrase/.test(n)){return {text:"",cmd:"undo"}}
  t=t.replace(/\s+nouveau paragraphe\s*/gi,"\n\n").replace(/\s+point [àa] la ligne\s*/gi,".\n").replace(/\s+[àa] la ligne\s*/gi,"\n")
     .replace(/\s+point final\s*/gi,". ").replace(/\s+point d'interrogation\s*/gi,"? ").replace(/\s+point d'exclamation\s*/gi,"! ")
     .replace(/\s+virgule\b/gi,",").replace(/\s+deux points\b/gi," :").replace(/\s+ouvrez? les guillemets\s*/gi," « ").replace(/\s+fermez? les guillemets\b/gi," »");
  t=t.replace(/([\wÀ-ÿ']+)\s+point\s*$/i,(m0,w)=>/^(?:[ldcsj]')?(autre|un|ce|le|du|bon|premier|dernier|second|seul|meme|même|quel|chaque)$/i.test(w)?m0:w+".");
  t=fixVocab(t).replace(/[ \t]+([,.?!])/g,"$1").replace(/[ \t]{2,}/g," ").replace(/^[ \t]+|[ \t]+$/g,"");
  if(t&&!/[.!?,:;\n»]$/.test(t)) t+=".";
  if(t) t=t.charAt(0).toUpperCase()+t.slice(1);
  return {text:t,cmd};
}
function joinText(a,b){if(!b)return a;if(!a)return b;return a+(/\n$/.test(a)?"":" ")+b}
function capAfter(a,b){return /[.!?\n]\s*$/.test(a)||!a?b:b.charAt(0).toLowerCase()+b.slice(1)}
function ovRender(){
  const el=$("#ovText"); if(!el) return;
  el.innerHTML=committed||interimTxt?h(committed)+(interimTxt?` <span class="int">${h(interimTxt)}</span>`:""):`<span class="ph">Je vous écoute… Racontez la journée : ce qui a bien fonctionné, ce qui peut progresser, les objections entendues.</span>`;
  el.scrollTop=el.scrollHeight;
  const ta=$("#dict"); if(ta) ta.value=committed;
}
function fmtT(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
async function wake(on){try{if(on&&"wakeLock" in navigator){WL=await navigator.wakeLock.request("screen")}else if(!on&&WL){await WL.release();WL=null}}catch(_){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&recOn)wake(true)});
function openOv(){const ov=$("#ov");ov.hidden=false;const m=DRAFT&&member(DRAFT.memberId);$("#ovName").textContent=m?"Duo avec "+m.name:"";document.body.style.overflow="hidden";ovRender()}
function closeOv(){const ov=$("#ov");ov.hidden=true;document.body.style.overflow="";clearInterval(tick);tick=null}
function startRec(resume){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const ta=$("#dict");
  if(!SR){toast("Dictée intégrée non disponible ici : utilisez le micro du clavier");ta&&ta.focus();return}
  if(!resume){committed=(ta?ta.value:(DRAFT&&DRAFT.text)||"").trim();elapsed=0}
  interimTxt=""; recOn=true; t0=Date.now();
  openOv(); $("#ov").classList.remove("paused"); $("#ovState").textContent="J'écoute"; $("#ovPause").textContent="Pause";
  clearInterval(tick); tick=setInterval(()=>{$("#ovTime").textContent=fmtT(elapsed+Date.now()-t0)},500);
  wake(true); listen();
}
function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  REC=new SR(); REC.lang="fr-FR"; REC.continuous=true; REC.interimResults=true; REC.maxAlternatives=1;
  REC.onresult=e=>{
    interimTxt="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const tr=e.results[i][0].transcript;
      if(e.results[i].isFinal){
        const p=processFinal(tr);
        if(p.cmd==="undo"){committed=committed.replace(/\s*[^.!?\n]+[.!?]?\s*$/,"");toast("Dernière phrase effacée")}
        else if(p.text) committed=joinText(committed,capAfter(committed,p.text));
        if(p.cmd==="stop"){finish(false);return}
        if(p.cmd==="gen"){finish(true);return}
      } else interimTxt+=tr;
    }
    const ov=$("#ov"); ov.classList.add("speaking"); clearTimeout(spkT); spkT=setTimeout(()=>ov.classList.remove("speaking"),900);
    if(DRAFT){DRAFT.text=committed;saveDraft()}
    ovRender();
  };
  REC.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){recOn=false;toast("Autorisez le micro pour ce site dans les réglages du navigateur");closeOv();wake(false)}
    else if(e.error==="network"){$("#ovState").textContent="Connexion instable…"}
  };
  REC.onend=()=>{ if(recOn){ setTimeout(()=>{ if(recOn){ try{listen()}catch(_){} } },200) } };
  try{REC.start()}catch(_){}
}
function pauseRec(){
  recOn=false; elapsed+=Date.now()-t0; clearInterval(tick); if(REC){try{REC.stop()}catch(_){}}
  if(interimTxt){committed=joinText(committed,capAfter(committed,processFinal(interimTxt).text));interimTxt=""}
  $("#ov").classList.add("paused"); $("#ovState").textContent="En pause"; $("#ovPause").textContent="Reprendre"; ovRender();
  if(DRAFT){DRAFT.text=committed;saveDraft()}
}
function stopRec(){
  const was=recOn; recOn=false; if(REC){try{REC.stop()}catch(_){}} wake(false);
  if(interimTxt){committed=joinText(committed,capAfter(committed,processFinal(interimTxt).text));interimTxt=""}
  const el=$("#dict"); if(el&&(was||!$("#ov").hidden)) el.value=committed;
  if(el&&DRAFT){DRAFT.text=el.value;saveDraft()}
  clearInterval(tick);
}
function finish(gen){stopRec();closeOv();if(gen)setTimeout(doGenerate,50);else toast("Dictée enregistrée")}
function doGenerate(){
  stopRec(); closeOv();
  const ta=$("#dict"); const txt=((ta?ta.value:DRAFT.text)||"").trim(); DRAFT.text=txt;

  saveDraft(); go("#r/draft");

  const box=(c,title,body,fill)=>`<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${B(c,24)}</w:tblBorders><w:tblCellMar><w:top w:w="100" w:type="dxa"/><w:left w:w="180" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:right w:w="180" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="10200"/></w:tblGrid><w:tr><w:tc><w:tcPr><w:tcW w:w="5000" w:type="pct"/>${fill?`<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>`:""}</w:tcPr>${P(run(title,{b:true,c,caps:true,sz:19}),{after:80})}${body}</w:tc></w:tr></w:tbl>`+P("",{after:120});
  const cell=(k,v)=>`<w:tc><w:tcPr><w:tcW w:w="1250" w:type="pct"/></w:tcPr>${P(run(k,{caps:true,c:"8A8CA0",sz:14}),{after:20})}${P(run(v,{b:true,sz:19}),{after:40})}</w:tc>`;
  const info=[["Délégué(e)",D.m.name],["Fonction",D.m.role||"-"],["Secteur",D.m.secteur||"-"],["Date du duo",D.date],["Visites réalisées",D.nb||"-"],["Produits travaillés",D.prod||"-"],["Directrice régionale",D.d?D.d.name:"-"],["Objectif précédent",D.prevSt||"-"]];
  const infoT=`<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${B()}<w:insideH w:val="single" w:sz="4" w:color="E6E7EE"/><w:insideV w:val="single" w:sz="4" w:color="E6E7EE"/></w:tblBorders><w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="120" w:type="dxa"/><w:right w:w="120" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="2550"/><w:gridCol w:w="2550"/><w:gridCol w:w="2550"/><w:gridCol w:w="2550"/></w:tblGrid><w:tr>${info.slice(0,4).map(x=>cell(...x)).join("")}</w:tr><w:tr>${info.slice(4).map(x=>cell(...x)).join("")}</w:tr></w:tbl>`+P("",{after:120});
  const C={acq:"4E8C74",axes:"B5735C",obj:"5F79A8",camp:"A88A4C",next:"7466B0",grid:"6C83B0"};
  const body={
   acq:D.acq.length?D.acq.map(x=>bul(x.t,x.k)).join(""):E,
   axes:D.axes.length||D.other.length?D.axes.map((x,i)=>P(run((i+1)+". "+x.l,{b:true}),{before:40})+(x.o?lbl("Observé",x.o):"")+(x.c?lbl("Conseil",x.c):"")+(x.p?lbl("Autre piste",x.p):"")).join("")+D.other.map(o=>bul(o)).join(""):E,
   obj:D.obj.length?D.obj.map(o=>P(run("« "+o.q+" »",{b:true}),{before:40})+o.r.map(x=>bul(x)).join("")+(o.src.length?P(run("Source : "+o.src.map(s=>s.n+" → "+s.url).join(" ; "),{c:"6B6E85",sz:16}),{ind:340}):"")).join(""):E,
   camp:D.camp.length?D.camp.map(c=>bul(c)).join(""):E,
   next:D.next?P(run(D.next)):E,
   grid:D.grid.length?D.grid.map(g=>P(run(g.l+" : ")+run(LEVELS[g.v],{b:true})+run("  "+"●".repeat(g.v)+"○".repeat(3-g.v),{c:"6C83B0"}),{ind:340})).join(""):E};
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>
   ${P(run("Compte-rendu de visite duo",{b:true,sz:34}),{after:20})}${P(run(D.m.name+" · "+D.date,{c:"6B6E85",sz:18}),{after:160,bdr:'<w:pBdr><w:bottom w:val="single" w:sz="12" w:space="4" w:color="23253A"/></w:pBdr>'})}
   ${infoT}
   ${box("23253A","Synthèse",P(run(D.headline||PD_EMPTY))+(D.prevObj?P(run("Objectif fixé au duo précédent : ",{b:true})+run(D.prevObj+(D.prevSt?" ("+D.prevSt+")":""),{c:"4A4D66"})):""),"F6F6F9")}
   ${PD_SECTIONS.map(([k,t],i)=>box(C[k],(i+1)+"   "+t,body[k])).join("")}
   ${P(run(D.d?D.d.name+", Directrice régionale":"",{c:"4A4D66",sz:18})+"<w:r><w:tab/></w:r>"+run("Document interne · usage managérial",{c:"4A4D66",sz:18}),{before:120,bdr:'<w:tabs><w:tab w:val="right" w:pos="10300"/></w:tabs>'})}
   <w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="794" w:right="794" w:bottom="907" w:left="794" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial" w:eastAsia="Arial"/><w:color w:val="23253A"/><w:sz w:val="20"/><w:lang w:val="fr-FR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="60" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`;
  return zipStore([
   ["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`],
   ["_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`],
   ["word/_rels/document.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
   ["word/document.xml",doc],["word/styles.xml",styles]]);
}
async function exportWord(r){
  const m=member(r.memberId), name=("CR duo "+(m?m.name:"")+" "+r.date).replace(/[^\wÀ-ÿ \-]/g,"")+".docx";
  const blob=docxBlob(r), file=new File([blob],name,{type:blob.type});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return} }catch(e){ if(e&&e.name==="AbortError") return; }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast("Fichier Word créé");
}
function printReport(r){
  const el=document.getElementById("pd"); el.innerHTML=pdHTML(r); document.body.classList.add("pdmode");
  const m=member(r.memberId), old=document.title; document.title="CR duo "+(m?m.name:"")+" "+r.date;
  const done=()=>{document.body.classList.remove("pdmode");document.title=old;window.removeEventListener("afterprint",done)};
  window.addEventListener("afterprint",done); setTimeout(()=>window.print(),60); setTimeout(done,60000);
}
function reportText(r){
  const D=pdData(r), E="  "+PD_EMPTY, L=["COMPTE-RENDU DE VISITE DUO","",
   "Délégué(e) : "+D.m.name+(D.m.role?" ("+D.m.role+")":""),"Date du duo : "+D.date,"Visites réalisées : "+(D.nb||"-"),"Produits travaillés : "+(D.prod||"-"),
   "Objectif précédent : "+(D.prevSt||"-"),"","SYNTHÈSE",D.headline||E];
  if(D.prevObj) L.push("Objectif fixé au duo précédent : "+D.prevObj);
  const sec=(i,t,lines)=>{L.push("",(i)+". "+t.toUpperCase());lines.length?L.push(...lines):L.push(E)};
  sec(1,"Acquis à conserver",D.acq.flatMap(x=>["• "+x.t].concat(x.k?["   "+x.k]:[])));
  sec(2,"Axes de progrès",D.axes.flatMap((x,i)=>[(i+1)+") "+x.l].concat(x.o?["   Observé : "+x.o]:[],x.c?["   Conseil : "+x.c]:[],x.p?["   Autre piste : "+x.p]:[])).concat(D.other.map(o=>"• "+o)));
  sec(3,"Objections et réponses",D.obj.flatMap(o=>["• « "+o.q+" »"].concat(o.r.map(x=>"   - "+x),o.src.map(s=>"   Source : "+s.n+" → "+s.url))));
  sec(4,"Campagne et chiffres",D.camp.map(c=>"• "+c));
  sec(5,"Objectif pour le prochain duo",D.next?[D.next]:[]);
  sec(6,"Compétences observées",D.grid.map(g=>"• "+g.l+" : "+LEVELS[g.v]));
  if(D.d) L.push("",D.d.name+", Directrice régionale");
  return L.join("\n");
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast("Compte-rendu copié"),()=>fallbackCopy(t))}else fallbackCopy(t);
}
function fallbackCopy(t){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Compte-rendu copié")}catch(_){toast("Copie impossible")}ta.remove()}

if(typeof document!=="undefined"&&document.getElementById("app")) render();
if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
